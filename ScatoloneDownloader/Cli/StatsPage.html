<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scatolone Cube Stats</title>
<style>
  :root { --bg:#12141a; --panel:#1c1f27; --rail:#171a21; --accent:#4da3ff; --on:#2e7d32; --txt:#e6e6e6; --muted:#8b93a3; --line:#2c313c; --accent-rgb:77,163,255; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 system-ui,Segoe UI,sans-serif; padding:18px 24px 40px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
  h1 { font-size:22px; margin:0; font-weight:600; }
  h2 { font-size:16px; margin:28px 0 8px; font-weight:600; }
  button { background:#0d0f14; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:13px system-ui,Segoe UI,sans-serif; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:600; }
  a.btn { display:inline-block; background:#0d0f14; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:13px system-ui,Segoe UI,sans-serif; }
  a.btn:hover { border-color:var(--accent); text-decoration:none; }
  [hidden] { display:none !important; }
  #updated { font-size:12px; color:var(--muted); }
  #note { font-size:12px; color:var(--muted); margin:8px 0 12px; }
  #viewbar { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }

  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
  table { border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { padding:5px 10px; border-bottom:1px solid #22262f; text-align:right; white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:12px; background:var(--rail); }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:var(--panel); z-index:1; }
  th:first-child { background:var(--rail); }
  tr.meta td { color:var(--muted); }
  tr.group td { color:var(--muted); font-weight:600; font-size:12px; text-align:left; background:var(--rail); }
  td.zero { color:var(--muted); }
  td .pct { color:var(--muted); font-size:11px; margin-left:5px; }
  td a { color:var(--txt); }
  td.zero a { color:var(--muted); }
  td.name { cursor:help; }
  .sum { font-size:12px; color:var(--muted); margin:0 0 8px; }
  td.tags { white-space:normal; font-size:11px; color:var(--muted); min-width:140px; text-align:left; }

  #err { position:fixed; top:0; left:0; right:0; z-index:30; background:#8a1f1f; color:#fff; padding:10px 14px; font-weight:600; text-align:center; }
  #err[hidden] { display:none; }

  @media (max-width: 820px) {
    body { padding:14px 16px 40px; font-size:16px; }
    button { padding:10px 14px; font-size:15px; }
    th:first-child, td:first-child { min-width:110px; }
  }

  /* A printed or PDF copy: light, ink-friendly, nothing clipped, nothing to click.
     The shading of the effect cells stays (print-color-adjust), so the hot spots
     still show on paper. */
  @media print {
    body { background:#fff; color:#000; padding:0; font-size:12px; }
    a, td a, td.zero a { color:#000; }
    #updated, #note, .sum, th, tr.meta td, tr.group td, td.zero, td .pct, td.tags, #viewbar { color:#555; }
    .wrap { overflow:visible; background:#fff; border-color:#ccc; }
    th, td { border-bottom-color:#ddd; }
    th, tr.group td { background:#fff; }
    th:first-child, td:first-child { position:static; background:#fff; }
    #refresh, #back, #dlHtml, #dlMd, #viewbar button:not(.on) { display:none; }
    #viewbar button.on { background:none; border:0; color:#555; padding:0; font-weight:400; }
    td[style*="background"] { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  }
</style>
</head>
<body>
<div id="err" hidden>&#9888; Could not load the stats from the tagger &mdash; is it still running?</div>
<header>
  <h1>Cube stats</h1>
  <a href="/" id="back">&larr; Tagger</a>
  <button type="button" id="refresh">Refresh</button>
  <a class="btn" id="dlHtml" href="/api/report.html">Download .html</a>
  <a class="btn" id="dlMd" href="/api/report.md">Download .md</a>
  <span id="updated"></span>
</header>
<noscript><p>This report needs JavaScript: open it in a web browser.</p></noscript>
<div id="note">Numbers are live from the tagger's memory, so they follow every change at once.</div>
<div id="viewbar">Columns:
  <button type="button" id="vMono" class="on">mono + Multi</button>
  <button type="button" id="vIdentity">colour incl. multi</button>
</div>
<div id="out"></div>
<script>
// Frozen copy: the `report` and `analyze` commands and the download links put the data in
// window.STATS_SNAPSHOT before this script. The page then renders from it, fetches
// nothing and links nowhere (there is no tagger to open); the live page has none.
const SNAPSHOT = window.STATS_SNAPSHOT || null;
let payload = null;
// The static note; the live load adds the payload's scope to it (a frozen copy sets its own).
const LIVE_NOTE = document.getElementById("note").textContent;
let view = new URLSearchParams(location.search).get("view") === "identity" ? "identity" : "mono";

// Plain links into the tagger, same tab, so the back button returns here with
// the scope still in the tagger's query string. The tier's rating param plus
// status=None and type=*nonland reproduce the analyzer's own population; the
// creature tables pass type=Creature and a cost bucket instead. A trailing rating
// ("r3".."r5", the star cells) replaces the tier's rating param.
// A frozen copy has no tagger to link to: null, so every count is a plain number.
function link(tier, colorParam, effectsParam, match, type, cost, rating) {
  if (SNAPSHOT) return null;
  const q = ["review=all", "rating=" + encodeURIComponent(rating || tier.ratingParam), "status=None", "type=" + (type || "*nonland")];
  if (cost) q.push("cost=" + encodeURIComponent(cost));
  if (colorParam) q.push("color=" + encodeURIComponent(colorParam));
  if (effectsParam) q.push("effects=" + effectsParam.split(",").map(encodeURIComponent).join(","));
  if (match) q.push("match=" + match);
  return "/?" + q.join("&");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// A count cell: the number (a link unless href is null) and a muted share of its
// column. Zero is a muted dash — a hole worth seeing, not a number to read.
function countCell(n, denom, href, shade) {
  const td = el("td");
  if (n === 0) {
    td.className = "zero";
    td.textContent = "–";
    return td;
  }
  let host = td;
  if (href) { host = el("a"); host.href = href; td.appendChild(host); }
  host.appendChild(document.createTextNode(n.toLocaleString()));
  if (denom > 0) host.appendChild(el("span", "pct", Math.round(n * 100 / denom) + "%"));
  if (shade != null && shade > 0) td.style.background = `rgba(var(--accent-rgb), ${(0.08 + 0.5 * shade).toFixed(3)})`;
  return td;
}

function headRow(first, columns) {
  const tr = el("tr");
  tr.appendChild(el("th", null, first));
  columns.forEach(c => tr.appendChild(el("th", null, c.name)));
  tr.appendChild(el("th", null, "Total"));
  return tr;
}

function matrixTable(tier, m) {
  const table = el("table");
  const thead = el("thead");
  thead.appendChild(headRow("", m.columns));
  table.appendChild(thead);
  const body = el("tbody");

  const metaRow = (label, counts, total, effectsParam, linked) => {
    const tr = el("tr", "meta");
    tr.appendChild(el("td", null, label));
    m.columns.forEach(c => tr.appendChild(countCell(
      counts[c.key] || 0, m.cards[c.key] || 0,
      linked ? link(tier, c.colorParam, effectsParam) : null, null)));
    tr.appendChild(countCell(total, m.totalCards, linked ? link(tier, "", effectsParam) : null, null));
    body.appendChild(tr);
  };
  metaRow("Non-land", m.cards, m.totalCards, "", true);
  metaRow("Reviewed", m.reviewed, m.totalReviewed, "", false);
  metaRow("Untagged", m.untagged, m.totalUntagged, "*none", true);

  m.rows.forEach(row => {
    const tr = el("tr");
    const name = el("td", "name", row.effect);
    const i = payload.effects.indexOf(row.effect);
    if (i >= 0 && payload.glossary[i]) name.title = payload.glossary[i];
    tr.appendChild(name);

    // Shade by share of the column, relative to the row's own maximum, so the
    // rare effects still show where they live instead of vanishing next to Removal.
    const shares = m.columns.map(c => (m.cards[c.key] ? (row.byColumn[c.key] || 0) / m.cards[c.key] : 0));
    const max = Math.max(...shares, 0);
    m.columns.forEach((c, k) => tr.appendChild(countCell(
      row.byColumn[c.key] || 0, m.cards[c.key] || 0,
      link(tier, c.colorParam, row.effect), max > 0 ? shares[k] / max : 0)));
    tr.appendChild(countCell(row.total, m.totalCards, link(tier, "", row.effect), null));
    body.appendChild(tr);
  });
  table.appendChild(body);
  return table;
}

function answersTable(tier, m) {
  const table = el("table");
  const thead = el("thead");
  const hr = el("tr");
  hr.appendChild(el("th", null, "Answer"));
  hr.appendChild(el("th", null, "Tags"));
  m.columns.forEach(c => hr.appendChild(el("th", null, c.name)));
  ["Total", "Targets", "Targets / answer"].forEach(t => hr.appendChild(el("th", null, t)));
  thead.appendChild(hr);
  table.appendChild(thead);
  const body = el("tbody");
  tier.answers.forEach(g => {
    const tr = el("tr");
    tr.appendChild(el("td", null, g.label));
    tr.appendChild(el("td", "tags", g.effects.join(", ")));
    const counts = view === "identity" ? g.byIdentity : g.byMono;
    const eff = g.effects.join(",");
    m.columns.forEach(c => tr.appendChild(countCell(
      counts[c.key] || 0, m.cards[c.key] || 0, link(tier, c.colorParam, eff, "any"), null)));
    tr.appendChild(countCell(g.total, m.totalCards, link(tier, "", eff, "any"), null));
    tr.appendChild(el("td", null, g.targets == null ? "–" : g.targets.toLocaleString()));
    tr.appendChild(el("td", null, g.targets == null || g.total === 0 ? "–" : (g.targets / g.total).toFixed(1)));
    body.appendChild(tr);
  });
  table.appendChild(body);
  return table;
}

// The cost table of the creature profile. Only the Creatures cell opens the
// tagger (type=Creature, one cost bucket); evasive/haste/defender have no
// tagger filter, so they stay plain numbers.
function creaturesTable(tier) {
  const c = tier.creatures;
  const table = el("table");
  const thead = el("thead");
  const hr = el("tr");
  ["Cost", "Creatures", "Avg power", "Avg toughness", "Evasive", "Haste", "Defender"].forEach(t => hr.appendChild(el("th", null, t)));
  thead.appendChild(hr);
  table.appendChild(thead);
  const body = el("tbody");
  const avg = v => v == null ? "–" : v.toFixed(1);
  const plain = n => el("td", n === 0 ? "zero" : null, n === 0 ? "–" : n.toLocaleString());
  [...c.rows, c.total].forEach((row, i) => {
    const isTotal = i === c.rows.length;
    const tr = el("tr", isTotal ? "meta" : null);
    tr.appendChild(el("td", null, row.label));
    tr.appendChild(countCell(row.creatures, c.total.creatures,
      link(tier, "", "", "", "Creature", row.cost), null));
    tr.appendChild(el("td", null, avg(row.powerAvg)));
    tr.appendChild(el("td", null, avg(row.toughnessAvg)));
    tr.appendChild(plain(row.evasive));
    tr.appendChild(plain(row.haste));
    tr.appendChild(plain(row.defender));
    body.appendChild(tr);
  });
  table.appendChild(body);
  return table;
}

// Creatures by cost (rows) and colour (columns), following the mono/identity
// toggle. A cell's share is of its column's creatures; the Total row and the
// Total column drop their cost / colour filter.
function curveTable(tier, curve) {
  const total = tier.creatures.total.creatures;
  const table = el("table");
  const thead = el("thead");
  thead.appendChild(headRow("Cost", curve.columns));
  table.appendChild(thead);
  const body = el("tbody");
  curve.rows.forEach(row => {
    const tr = el("tr");
    tr.appendChild(el("td", null, row.label));
    curve.columns.forEach(c => tr.appendChild(countCell(
      row.byColumn[c.key] || 0, curve.totals[c.key] || 0,
      link(tier, c.colorParam, "", "", "Creature", row.cost), null)));
    tr.appendChild(countCell(row.total, total, link(tier, "", "", "", "Creature", row.cost), null));
    body.appendChild(tr);
  });
  const tr = el("tr", "meta");
  tr.appendChild(el("td", null, "Total"));
  curve.columns.forEach(c => tr.appendChild(countCell(
    curve.totals[c.key] || 0, curve.totals[c.key] || 0,
    link(tier, c.colorParam, "", "", "Creature"), null)));
  tr.appendChild(countCell(total, total, link(tier, "", "", "", "Creature"), null));
  body.appendChild(tr);
  table.appendChild(body);
  return table;
}

function plainHead(labels) {
  const tr = el("tr");
  labels.forEach(t => tr.appendChild(el("th", null, t)));
  const thead = el("thead");
  thead.appendChild(tr);
  return thead;
}

// A group row of the category tables: the group's label across every column.
function groupRow(label, span) {
  const tr = el("tr", "group");
  const td = el("td", null, label);
  td.colSpan = span;
  tr.appendChild(td);
  return tr;
}

// A tier's global distribution by type and cost. Not part of the mono/identity
// toggle: the rows are macro types. The shares of the cost cells are of the row.
function typesTable(tier, o) {
  const all = o.nonLand + o.lands;
  const table = el("table");
  table.appendChild(plainHead(["Type", "Cards", ...payload.buckets.map(b => b.label)]));
  const body = el("tbody");

  o.types.forEach(t => {
    const tr = el("tr");
    tr.appendChild(el("td", null, t.label));
    tr.appendChild(countCell(t.cards, all, link(tier, "", "", "", t.macro), null));
    payload.buckets.forEach(({ key }) => tr.appendChild(countCell(
      t.byCost[key] || 0, t.cards, link(tier, "", "", "", t.macro, key), null)));
    body.appendChild(tr);
  });

  const nl = el("tr", "meta");
  nl.appendChild(el("td", null, "Non-land"));
  nl.appendChild(countCell(o.nonLand, all, link(tier, "", "", "", "*nonland"), null));
  payload.buckets.forEach(({ key }) => nl.appendChild(countCell(
    o.curveTotal[key] || 0, o.nonLand, link(tier, "", "", "", "*nonland", key), null)));
  body.appendChild(nl);

  // Lands carry no mana value in the analysis, so their cost cells stay empty.
  const ln = el("tr", "meta");
  ln.appendChild(el("td", null, "Lands"));
  ln.appendChild(countCell(o.lands, all, link(tier, "", "", "", "Land"), null));
  payload.buckets.forEach(() => ln.appendChild(el("td", "zero", "–")));
  body.appendChild(ln);

  table.appendChild(body);
  return table;
}

// The pool by exact colour category, in the analyzer's groups. A category's colour
// filter is its category name ("2 Azorius"); the Total row has none. Shares: the type and star
// cells of the row's own cards, Cards of the tier's non-land, Lands of the tier's lands.
// The bench is ★2 by definition, so its table drops the ★3/★4/★5 columns.
function categoriesTable(tier, o, withStars) {
  const heads = ["Category", "Cards", "Creatures", "Other perm.", "Spells", "Avg MV", "Creature avg MV", "Pips"]
    .concat(withStars ? ["★3", "★4", "★5"] : [], ["Lands"]);
  const table = el("table");
  table.appendChild(plainHead(heads));
  const body = el("tbody");
  const avg = v => el("td", null, v == null ? "–" : v.toFixed(2));

  const addRow = (r, cls) => {
    const c = r.colorParam;
    const tr = el("tr", cls);
    tr.appendChild(el("td", null, r.name));
    tr.appendChild(countCell(r.cards, o.nonLand, link(tier, c), null));
    tr.appendChild(countCell(r.creatures, r.cards, link(tier, c, "", "", "Creature"), null));
    tr.appendChild(countCell(r.otherPermanents, r.cards, link(tier, c, "", "", "OtherPermanent"), null));
    tr.appendChild(countCell(r.spells, r.cards, link(tier, c, "", "", "Spell"), null));
    tr.appendChild(avg(r.averageMv));
    tr.appendChild(avg(r.creatureAverageMv));
    tr.appendChild(avg(r.pipDensity));
    if (withStars) {
      tr.appendChild(countCell(r.rated3, r.cards, link(tier, c, "", "", null, null, "r3"), null));
      tr.appendChild(countCell(r.rated4, r.cards, link(tier, c, "", "", null, null, "r4"), null));
      tr.appendChild(countCell(r.rated5, r.cards, link(tier, c, "", "", null, null, "r5"), null));
    }
    tr.appendChild(countCell(r.lands, o.lands, link(tier, c, "", "", "Land"), null));
    body.appendChild(tr);
  };

  o.groups.forEach(g => {
    body.appendChild(groupRow(g.label, heads.length));
    g.rows.forEach(r => addRow(r, null));
  });
  addRow(o.total, "meta");
  table.appendChild(body);
  return table;
}

// Mana value (0 to 6+) by colour category. Rows without the counted cards (lands
// only, or no creatures) are left out; each cell's share is of its row's Total,
// which is the row's cards (or creatures) and links with the colour alone.
function costByCategoryTable(tier, o, byCost, count, type) {
  const table = el("table");
  table.appendChild(plainHead(["Category", ...payload.buckets.map(b => b.label), "Total"]));
  const body = el("tbody");

  const addRow = (r, cls) => {
    const c = r.colorParam;
    const n = count(r);
    const tr = el("tr", cls);
    tr.appendChild(el("td", null, r.name));
    payload.buckets.forEach(({ key }) => tr.appendChild(countCell(byCost(r)[key] || 0, n, link(tier, c, "", "", type, key), null)));
    tr.appendChild(countCell(n, n, link(tier, c, "", "", type), null));
    body.appendChild(tr);
  };

  o.groups.forEach(g => {
    const rows = g.rows.filter(r => count(r) > 0);
    if (rows.length === 0) return;
    body.appendChild(groupRow(g.label, payload.buckets.length + 2));
    rows.forEach(r => addRow(r, null));
  });
  addRow(o.total, "meta");
  table.appendChild(body);
  return table;
}

// A muted explanatory line above the table, optional.
function section(title, table, note) {
  const out = document.getElementById("out");
  out.appendChild(el("h2", null, title));
  if (note) out.appendChild(el("div", "sum", note));
  const wrap = el("div", "wrap");
  wrap.appendChild(table);
  out.appendChild(wrap);
}

// One section's table, by the payload's kind and tier. An unknown kind has no table.
function sectionTable(s) {
  const bench = s.tier === "bench";
  const tier = bench ? payload.bench : payload.pool;
  const o = bench ? payload.benchOverview : payload.overview;
  switch (s.kind) {
    case "types": return typesTable(tier, o);
    case "categories": return categoriesTable(tier, o, !bench);
    case "manaValue": return costByCategoryTable(tier, o, r => r.byCost, r => r.cards, "*nonland");
    case "creatureManaValue": return costByCategoryTable(tier, o, r => r.creatureByCost, r => r.creatures, "Creature");
    case "effects": return matrixTable(tier, tier[view]);
    case "answers": return answersTable(tier, tier[view]);
    case "creatures": return creaturesTable(tier);
    case "curve": return curveTable(tier, tier.creatures[view === "identity" ? "curveIdentity" : "curveMono"]);
    default: return null;
  }
}

function render() {
  document.getElementById("vMono").className = view === "mono" ? "on" : "";
  document.getElementById("vIdentity").className = view === "identity" ? "on" : "";
  const out = document.getElementById("out");
  out.innerHTML = "";
  if (!payload) return;
  document.getElementById("vMono").textContent = payload.viewNames.mono;
  document.getElementById("vIdentity").textContent = payload.viewNames.identity;
  payload.sections.forEach(s => {
    const table = sectionTable(s);
    if (table) section(s.title, table, s.note);
  });
}

async function load() {
  if (SNAPSHOT) {
    payload = SNAPSHOT;
    render();
    return;
  }
  try {
    const r = await fetch("/api/stats", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    payload = await r.json();
    document.getElementById("err").hidden = true;
    document.getElementById("note").textContent = LIVE_NOTE + " " + payload.scope;
    document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString([], { hour12: false });
    render();
  } catch (e) {
    document.getElementById("err").hidden = false;
  }
}

function setView(v) {
  view = v;
  const q = new URLSearchParams(location.search);
  if (v === "identity") q.set("view", "identity"); else q.delete("view");
  const qs = q.toString();
  try { history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "")); } catch { /* ignore */ }
  render();
}

document.getElementById("vMono").onclick = () => setView("mono");
document.getElementById("vIdentity").onclick = () => setView("identity");
document.getElementById("refresh").onclick = () => load();
if (SNAPSHOT) {
  ["back", "refresh", "dlHtml", "dlMd"].forEach(id => { document.getElementById(id).hidden = true; });
  // { title, subtitle, note }, written by the C# side (StatsDocument).
  const info = window.STATS_SNAPSHOT_INFO || {};
  if (info.title) document.querySelector("h1").textContent = info.title;
  document.getElementById("updated").textContent = info.subtitle || "";
  document.getElementById("note").textContent = info.note || "";
}
// No polling: the numbers refresh when you come back to the tab (typically from
// the tagger, after tagging) or on demand.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
// The back button from the tagger restores this page from the bfcache, which
// fires no visibilitychange: without this it would show the numbers from before
// the tagging session it is meant to reflect.
window.addEventListener("pageshow", e => { if (e.persisted) load(); });
load();
</script>
</body>
</html>
